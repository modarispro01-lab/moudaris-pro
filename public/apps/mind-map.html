<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المذكرة اليومية — خريطة ذهنية | Modaris Pro</title>
<link rel="stylesheet" href="shared/mp-toolkit.css">
<style>
  /* ============================================================
     أداة «الخريطة الذهنية للحصة» — تنسيقات خاصة
     تعتمد على متغيرات التصميم المشتركة (--t / --accent / --font-doc)
     ============================================================ */

  /* ألوان الفروع — مشتقة من لوحة الألوان المختارة */
  .bc0{ --bc: var(--t); }
  .bc1{ --bc: color-mix(in oklab, var(--t) 72%, #2563eb); }
  .bc2{ --bc: color-mix(in oklab, var(--t) 52%, #7c3aed); }
  .bc3{ --bc: color-mix(in oklab, var(--t) 58%, #0d9488); }
  .bc4{ --bc: color-mix(in oklab, var(--t) 52%, #c2410c); }
  .bc5{ --bc: color-mix(in oklab, var(--t) 58%, #be185d); }

  /* ---- لوحة المادة (ثلاث نسخ) ---- */
  .subj-btns{ display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .subj-btn{
    border: 1.6px solid var(--border); border-radius: 11px; background: #fff; cursor: pointer;
    padding: 10px 6px; font-family: inherit; font-weight: 800; font-size: 12px; color: #334155;
    display: flex; flex-direction: column; align-items: center; gap: 4px; transition: .15s;
  }
  .subj-btn span.ic{ font-size: 19px; line-height: 1; }
  .subj-btn:hover{ border-color: var(--primary); transform: translateY(-1px); }
  .subj-btn.active{ border-color: var(--primary); background: var(--primary); color: #fff; }

  /* ---- وثيقة الخريطة ---- */
  .mm-a4{ padding: 11mm; }
  .mm-frame{ display: flex; flex-direction: column; min-height: 275mm; }
  .a4.landscape .mm-frame{ min-height: 188mm; }

  .mm-head{ display: flex; justify-content: space-between; gap: 12px; border-bottom: 2.5px solid var(--t); padding-bottom: 6px; }
  .mm-head .k{ font-size: 10px; font-weight: 800; color: var(--t); line-height: 1.8; }
  .mm-head .e{ font-size: 10px; font-weight: 700; color: var(--t); line-height: 1.8; text-align: left; }

  .mm-titlebar{ text-align: center; margin: 9px 0 4px; }
  .mm-title{
    display: inline-block; background: var(--t); color: #fff; font-size: 14.5pt; font-weight: 800;
    padding: 5px 24px; border-radius: 999px; letter-spacing: .2px;
  }
  .mm-meta{ display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 7px; margin-top: 9px; }
  .mm-meta span{
    font-size: 9px; font-weight: 700; color: var(--t);
    background: var(--t-soft); border: 1px solid rgba(0,0,0,.07); border-radius: 999px; padding: 2px 10px;
  }

  /* ---- فضاء الخريطة ---- */
  .mind{ position: relative; height: 184mm; margin: 4px 0; }
  .a4.landscape .mind{ height: 100mm; }
  .mind-links{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .mind-links path{ fill: none; stroke: var(--bc, var(--t)); stroke-width: 1.8; stroke-linecap: round; }

  .mnode{ position: absolute; transform: translate(-50%,-50%); box-sizing: border-box; }
  .mnode [contenteditable]{ outline: none; border-radius: 4px; }
  .mnode [contenteditable]:focus{ background: rgba(127,127,127,.14); }

  /* العقدة المركزية */
  .mnode.center{
    width: 50mm; text-align: center; background: var(--t); color: #fff;
    border-radius: 18px; padding: 10px 9px; z-index: 4; box-shadow: 0 5px 14px rgba(0,0,0,.18);
  }
  .mnode.center .mnode-topic{ font-size: 12.5pt; font-weight: 800; line-height: 1.35; }
  .mnode.center .mnode-comp{
    font-size: 8.4pt; font-weight: 600; opacity: .95; margin-top: 6px;
    border-top: 1px solid rgba(255,255,255,.45); padding-top: 5px;
  }
  .mnode.center .mnode-comp:empty{ display: none; }

  /* الفروع */
  .mnode.branch{
    width: 57mm; background: #fff; border: 1.7px solid var(--bc, var(--t));
    border-radius: 13px; overflow: hidden; z-index: 3; box-shadow: 0 2px 8px rgba(0,0,0,.09);
  }
  .mnode-head{ display: flex; align-items: center; gap: 6px; background: var(--bc, var(--t)); color: #fff; padding: 4px 7px; }
  .mnode-step{
    width: 17px; height: 17px; border-radius: 50%; background: rgba(255,255,255,.28);
    display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; flex: 0 0 auto;
  }
  .mnode-name{ font-weight: 800; font-size: 9.3pt; flex: 1; line-height: 1.3; }
  .mnode-dur{
    font-size: 8pt; font-weight: 700; background: rgba(255,255,255,.24);
    border-radius: 7px; padding: 1px 7px; white-space: nowrap; flex: 0 0 auto;
  }
  .mnode-dur:empty{ display: none; }
  .mnode-role{
    font-size: 7.3pt; font-weight: 800; color: var(--bc, var(--t));
    background: color-mix(in oklab, var(--bc, var(--t)) 11%, #fff);
    padding: 2px 8px; border-bottom: 1px dashed color-mix(in oklab, var(--bc, var(--t)) 38%, #fff);
  }
  .mnode-items{ margin: 0; padding: 5px 9px 7px; list-style: none; }
  .mnode-items li{ font-size: 8pt; line-height: 1.55; position: relative; padding-inline-start: 11px; }
  .mnode-items li::before{
    content: "◆"; position: absolute; inset-inline-start: 0; top: 1px;
    color: var(--bc, var(--t)); font-size: 5.5pt;
  }

  /* ---- الأسطورة / الهدف / الوسائل / التذييل ---- */
  .mm-legend{ display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 5px; }
  .mm-legend i{
    font-style: normal; font-size: 7.8pt; font-weight: 700; border: 1px solid rgba(0,0,0,.12);
    border-radius: 999px; padding: 2px 9px; background: #fff; color: #334155;
  }
  .mm-legend i b{ color: var(--t); }
  .mm-objective{
    display: flex; align-items: flex-start; gap: 7px; margin-top: 8px;
    border: 1.6px dashed var(--t); border-radius: 11px; padding: 7px 11px;
    font-size: 9.2px; font-weight: 700; color: var(--t); background: var(--t-soft);
  }
  .mm-objective .k{ flex: 0 0 auto; }
  .mm-mat{
    margin-top: 7px; font-size: 8.6px; font-weight: 700; color: #334155;
    border-inline-start: 4px solid var(--accent); background: #fbfbfd; border-radius: 8px; padding: 5px 9px;
  }
  .mm-mat b{ color: var(--t); }
  .mm-foot{ margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding-top: 10px; }
  .mm-sign{ font-size: 8.5px; font-weight: 700; color: var(--t); text-align: center; flex: 0 0 34%; border-top: 1.6px solid var(--t); padding-top: 4px; }
  .mm-brand{ font-size: 8px; color: var(--muted); text-align: center; }

  /* لا تكسر الصفحة على عناصر الخريطة عند الطباعة */
  @media print{
    .mind, .mnode, .mm-frame{ page-break-inside: avoid; }
    .mnode [contenteditable]:focus{ background: transparent; }
  }
</style>
</head>

<div class="mp-app">

        <option value="portrait" data-t="optPortrait">عمودي (A4)</option>
        <option value="landscape" data-t="optLandscape">أفقي (A4)</option>
      </select>
    </div>
    <label class="mp-check"><input type="checkbox" id="showHeader"> <span data-t="cHeader">إظهار الترويسة الرسمية</span></label>
    <label class="mp-check"><input type="checkbox" id="showDur"> <span data-t="cDur">إظهار المدد الزمنية</span></label>
    <label class="mp-check"><input type="checkbox" id="showRole"> <span data-t="cRole">إظهار خطوة التعليم الصريح</span></label>
    <label class="mp-check"><input type="checkbox" id="showLegend"> <span data-t="cLegend">إظهار أسطورة التعليم الصريح</span></label>
    <label class="mp-check"><input type="checkbox" id="showObj"> <span data-t="cObj">إظهار هدف 80%</span></label>
    <label class="mp-check"><input type="checkbox" id="showSign"> <span data-t="cSign">إظهار خانات التوقيع</span></label>

    <div class="mp-section-title">👤 <span data-t="sProfile">بيانات الأستاذ (تُحفظ وتظهر في كل الأدوات)</span></div>
    <div class="mp-field"><label data-t="pName">الاسم الكامل</label><input type="text" data-profile="fullName"></div>
    <div class="mp-field"><label data-t="pEstab">المؤسسة</label><input type="text" data-profile="establishment"></div>
    <div class="mp-row">
      <div class="mp-field"><label data-t="pAcad">الأكاديمية</label><input type="text" data-profile="academy"></div>
      <div class="mp-field"><label data-t="pDir">المديرية الإقليمية</label><input type="text" data-profile="direction"></div>
    </div>

    <div class="mp-toolbar">
      <button class="mp-btn mp-btn-primary mp-btn-block" onclick="MP.print()">🖨️ <span data-t="btnPrint">طباعة / حفظ PDF</span></button>
    </div>
    <div class="mp-toolbar">
      <button class="mp-btn mp-btn-ghost mp-btn-sm" id="btnBlank">🧹 <span data-t="btnBlank">طبعة فارغة</span></button>
      <button class="mp-btn mp-btn-ghost mp-btn-sm" id="btnReset">♻️ <span data-t="btnReset">استعادة المراحل</span></button>
      <button class="mp-btn mp-btn-ghost mp-btn-sm" id="btnDemo">✨ <span data-t="btnDemo">مثال</span></button>
    </div>
    <div class="mp-note" data-t="note">💡 انقر على أي عبارة داخل الخريطة لتعديلها مباشرة قبل الطباعة. تُضبط المراحل والمدد تلقائياً حسب المادة والمستوى.</div>
  </aside>

  <main class="mp-stage" id="stage" data-mp-notranslate></main>
</div>

  /* ============================================================
     تخطيط الخريطة الذهنية (شمسي) + رسم الروابط
     ============================================================ */
  function boundary(cx0, cy0, hw0, hh0, tx, ty) {
    var dx = tx - cx0, dy = ty - cy0;
    if (!dx && !dy) return { x: cx0, y: cy0 };
    var s = 1 / Math.max(Math.abs(dx) / (hw0 || 1e-6), Math.abs(dy) / (hh0 || 1e-6));
    return { x: cx0 + dx * s, y: cy0 + dy * s };
  }

  function relax(pts, hw, hh, cw, ch, cx, cy) {
    var gx = 0.018, gy = 0.02, iter, i, j, moved;
    for (iter = 0; iter < 140; iter++) {
      moved = false;
      for (i = 0; i < pts.length; i++) {
        var dx = pts[i].x - cx, dy = pts[i].y - cy;
        var ox = (hw[i] + cw / 2 + gx) - Math.abs(dx);
        var oy = (hh[i] + ch / 2 + gy) - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          var d = Math.hypot(dx, dy) || 1e-6;
          var push = Math.min(ox, oy) * 0.5;
          pts[i].x += dx / d * push; pts[i].y += dy / d * push; moved = true;
        }
      }
      for (i = 0; i < pts.length; i++) {
        for (j = i + 1; j < pts.length; j++) {
          var ex = pts[j].x - pts[i].x, ey = pts[j].y - pts[i].y;
          var px = (hw[i] + hw[j] + gx) - Math.abs(ex);
          var py = (hh[i] + hh[j] + gy) - Math.abs(ey);
          if (px > 0 && py > 0) {
            if (px < py) { var sx = (ex >= 0 ? 1 : -1) * px * 0.5; pts[j].x += sx; pts[i].x -= sx; }
            else { var sy = (ey >= 0 ? 1 : -1) * py * 0.5; pts[j].y += sy; pts[i].y -= sy; }
            moved = true;
          }
        }
      }
      for (i = 0; i < pts.length; i++) {
        pts[i].x = Math.max(hw[i] + 0.006, Math.min(1 - hw[i] - 0.006, pts[i].x));
        pts[i].y = Math.max(hh[i] + 0.006, Math.min(1 - hh[i] - 0.006, pts[i].y));
      }
      if (!moved) break;
    }
  }

  function layoutMind(mind) {
    var center = mind.querySelector(".mnode.center");
    var nodes = Array.prototype.slice.call(mind.querySelectorAll(".mnode.branch"));
    var links = mind.querySelector(".mind-links");
    if (!center || !nodes.length || !links) return;

    var W = mind.offsetWidth, H = mind.offsetHeight;
    if (!W || !H) return;

    var cw = center.offsetWidth / W, ch = center.offsetHeight / H;
    var n = nodes.length, pts = [], hw = [], hh = [], i;
    for (i = 0; i < n; i++) {
      nodes[i].style.left = ""; nodes[i].style.top = "";
      var a = -Math.PI / 2 + i * (2 * Math.PI / n);
      pts.push({ x: 0.5 + 0.31 * Math.cos(a), y: 0.5 + 0.30 * Math.sin(a) });
      hw.push((nodes[i].offsetWidth / W) / 2);
      hh.push((nodes[i].offsetHeight / H) / 2);
    }

    relax(pts, hw, hh, cw, ch, 0.5, 0.5);

    center.style.left = "50%"; center.style.top = "50%";

    var out = "";
    for (i = 0; i < n; i++) {
      nodes[i].style.left = (pts[i].x * 100).toFixed(3) + "%";
      nodes[i].style.top = (pts[i].y * 100).toFixed(3) + "%";

      var p1 = boundary(0.5, 0.5, cw / 2, ch / 2, pts[i].x, pts[i].y);
      var p2 = boundary(pts[i].x, pts[i].y, hw[i], hh[i], 0.5, 0.5);
      var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      var dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1e-6;
      var sign = (i % 2 === 0 ? 1 : -1), bow = 0.11 * len;
      var qx = mx + (-dy / len) * bow * sign, qy = my + (dx / len) * bow * sign;
      out += '<path class="bc' + (i % 6) + '" d="M' +
        (p1.x * 100).toFixed(2) + "," + (p1.y * 100).toFixed(2) + " Q" +
        (qx * 100).toFixed(2) + "," + (qy * 100).toFixed(2) + " " +
        (p2.x * 100).toFixed(2) + "," + (p2.y * 100).toFixed(2) + '"/>';
    }
    links.innerHTML = out;
  }

  function layoutAll() {
    document.querySelectorAll("#stage .mind").forEach(layoutMind);
    MP.fit();
  }

  /* ============================================================
     معاملات الرابط (لتوليد المذكرات تلقائيًا عبر المتصفح دون واجهة)
     مثال: mind-map.html?subject=arabic&level=الرابع ابتدائي&semaine=1&topic=...&print=1
     content=رابط ملف JSON يحتوي {phases:[...], meta:{...}} لتغيير المراحل
     ============================================================ */
  var Q = null;
  try { Q = new URLSearchParams(location.search); } catch (e) { Q = null; }

  function applyParams(done) {
    if (!Q) return done();
    var g = function (k) { return Q.has(k) ? Q.get(k) : null; };
    if (g("subject") && SUBJECTS[g("subject")]) state.subject = g("subject");
    ["level", "periode", "semaine", "seance", "date", "topic", "comp", "objective", "materials"]
      .forEach(function (k) { if (g(k) != null) state[k] = g(k); });
    if (g("orient")) state.orientation = g("orient");
    if (g("font")) { try { MP.setDesign({ font: g("font") }); } catch (e) {} }
    [["header", "showHeader"], ["dur", "showDur"], ["role", "showRole"],
     ["legend", "showLegend"], ["obj", "showObj"], ["sign", "showSign"]]
      .forEach(function (p) {
        if (g(p[0]) != null) state[p[1]] = !(g(p[0]) === "0" || g(p[0]) === "false");
      });
    if (g("content")) {
      fetch(g("content")).then(function (r) { return r.json(); }).then(function (data) {
        if (data && data.phases) { store[defKey()] = data.phases; saveStore(); }
        if (data && data.meta) { Object.keys(data.meta).forEach(function (k) { state[k] = data.meta[k]; }); }
        done();
      }).catch(function () { done(); });
    } else { done(); }
  }

  applyParams(function () {
    fillNumberSelect("periode", 5, state.periode);
    renderPanelLang();
    populatePanel();
    bindPanel();
    render();
    if (Q && Q.get("print") === "1") setTimeout(function () { window.print(); }, 900);
  });
})();
</script>
</body>
</html>
